services:
  mapas:
    volumes:
      # Monta o diretório, não o arquivo — bind mount de arquivo dentro de bind mount falha no virtiofs.
      # "zz-" garante que este config.d ordene depois do config.d do core.
      - ../src/plugins/ConectaEnte/tests/config.d:/var/www/config/zz-conectaente.d

      # Subpasta de /var/www/tests, onde o autoload PSR-4 'Tests\' resolve Tests\ConectaEnte\*.
      - ../src/plugins/ConectaEnte/tests/src:/var/www/tests/ConectaEnte
